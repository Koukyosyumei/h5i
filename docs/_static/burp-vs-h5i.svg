<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Burp Suite and h5i use different control centers</title><desc id="desc">Burp centers a human tester around browser, proxy, scanner, extensions, and findings. h5i centers an AI agent inside a scoped browser session and optional sandbox, with evidence reviewed by a human.</desc><rect width="1200" height="630" fill="#0d0d0f"/><g font-family="Arial,sans-serif" fill="#eee"><text x="70" y="70" font-size="34" font-weight="700">Two control centers</text><text x="280" y="125" text-anchor="middle" font-size="28" font-weight="700">Burp Suite</text><text x="900" y="125" text-anchor="middle" font-size="28" font-weight="700">h5i</text><circle cx="280" cy="255" r="72" fill="#533"/><text x="280" y="265" text-anchor="middle" font-size="25">human</text><g font-size="20"><text x="90" y="410">browser</text><text x="220" y="455">proxy</text><text x="340" y="410">scanner</text><text x="220" y="365">extensions</text></g><g stroke="#a77" stroke-width="3"><line x1="280" y1="327" x2="130" y2="390"/><line x1="280" y1="327" x2="260" y2="430"/><line x1="280" y1="327" x2="380" y2="390"/><line x1="280" y1="327" x2="280" y2="375"/></g><rect x="730" y="175" width="340" height="250" rx="24" fill="#241719" stroke="#d21c1c" stroke-width="4"/><text x="900" y="225" text-anchor="middle" font-size="23">scoped session + box</text><circle cx="900" cy="305" r="55" fill="#d21c1c"/><text x="900" y="314" text-anchor="middle" font-size="24">agent</text><text x="900" y="395" text-anchor="middle" font-size="19">browser · recon · replay</text><line x1="900" y1="425" x2="900" y2="500" stroke="#d21c1c" stroke-width="4"/><text x="900" y="540" text-anchor="middle" font-size="23">human reviews evidence</text><text x="600" y="600" text-anchor="middle" font-size="18" fill="#aaa">Burp maximizes tester capability. h5i minimizes delegated authority.</text></g></svg>
