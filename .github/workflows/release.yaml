name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  # One binary. The rendering engine used to ship as a second archive
  # (`h5i-browser-light`) and is linked into this one now; `h5i browser` execs
  # itself to become it. That is still a release-only artifact rather than a
  # crates.io publish, because the engine depends on boa by git revision and
  # crates.io refuses that (see scripts/check_boa_release.sh).
  BINARY_NAME: h5i
  # The plugins, shipped beside the binary rather than inside it: see
  # `docs/design/design-websec.md` W21 and `docs/design/design-recon.md` N19.
  PLUGIN_NAME: h5i-websec
  RECON_NAME: h5i-recon

permissions:
  contents: write

# Never cancel a release mid-flight: a half-uploaded set of assets is worse
# than a duplicated run. Declared explicitly so it does not inherit a
# cancelling default if one is ever added at the repository level.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The `h5i ui` console is a React bundle embedded into the binary at compile
  # time. Built once here and fanned out to every target job rather than built
  # four times, which also keeps Node off three of the four runners. Every build
  # job sets H5I_SKIP_WEB_BUILD=1 and consumes this artifact.
  bundle:
    name: Build the console bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: The lockfile covers this runner's platform
        working-directory: web
        run: node ../scripts/check-lockfile-platforms.mjs

      - name: Build web/dist
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # The artifact pair is held at the *oldest* major that runs on Node 24
      # (upload v6, download v7) rather than at the newest, deliberately. Getting
      # off the deprecated Node 20 runtime is the whole point of the pin, and the
      # newer majors change behaviour rather than just the runtime: upload v7
      # adds direct unzipped uploads, and download v8 turns a hash mismatch into
      # an error. Both may well be improvements, and neither is testable here —
      # nothing in this file runs on a pull request, so a release is where it
      # would be found out. Take those on their own, when they are the change.
      - uses: actions/upload-artifact@v6
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  build:
    name: Build ${{ matrix.target }}
    needs: bundle
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 — native
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive_ext: tar.gz

          # Linux aarch64 — native, on GitHub's arm64 runner
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            archive_ext: tar.gz

          # macOS arm64 (Apple Silicon)
          - target: aarch64-apple-darwin
            os: macos-latest
            archive_ext: tar.gz

          # Windows x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive_ext: zip

    steps:
      - uses: actions/checkout@v7

      # Placed before the build so `rust-embed` finds a real bundle. With
      # H5I_SKIP_WEB_BUILD set the build script leaves an existing web/dist
      # alone and never reaches for npm.
      - name: Fetch the console bundle
        uses: actions/download-artifact@v7
        with:
          name: web-dist
          path: web/dist

      # The one failure this pipeline cannot afford to be quiet about. Because
      # every build below sets H5I_SKIP_WEB_BUILD, a bundle that failed to land
      # does not stop the build — the build script writes a placeholder page and
      # the release ships a binary whose `h5i ui` serves "console bundle not
      # built" with a 200. Assert the real thing is here while it is still a
      # build failure rather than a download someone installs.
      - name: The bundle is real, not the build-script stub
        shell: bash
        run: |
          set -euo pipefail
          test -f web/dist/index.html || { echo "::error::web/dist/index.html is missing"; exit 1; }
          if grep -q "console bundle not built" web/dist/index.html; then
            echo "::error::web/dist holds the build-script stub, not the console bundle."
            exit 1
          fi
          grep -q '/assets/' web/dist/index.html || {
            echo "::error::web/dist/index.html references no bundled asset."
            cat web/dist/index.html
            exit 1
          }
          test -d web/dist/assets
          echo "bundle ok: $(find web/dist/assets -type f | wc -l) asset(s)"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # musl linker/compiler. No libssl-dev either way: git2 is built without
      # `https`/`ssh`, so nothing in the graph links OpenSSL at all.
      - name: Install musl-tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y musl-tools

      # Every target builds natively, aarch64 Linux included: it used to go
      # through `cross`, whose container is Ubuntu 18.04 with no python in it,
      # and stylo generates its CSS property tables by running python at build
      # time. Installing the container's python3 does not help — it is 3.6, and
      # stylo's vendored mako needs 3.8. GitHub's arm64 runners are free for
      # public repositories, so the target that needed the most machinery is
      # now the same three steps as the other three.
      #
      # One build, and the engine is inside it: the binary links blitz, vello_cpu
      # and boa alongside git2, so a target that cannot compile the engine cannot
      # produce a release binary at all. That is the reading the asset guard
      # below already takes.
      # All three. `h5i-websec` and `h5i-recon` are the plugins: small clap
      # binaries that link no engine, so they cost seconds to build and a few
      # megabytes to ship. Without them in the release, `h5i plugin install
      # <name> --from …` has no file to point at unless you have the source and
      # a toolchain.
      - name: Build
        env:
          H5I_SKIP_WEB_BUILD: "1"
        # Folded (`>-`): YAML joins these into one line before any shell sees
        # them. This step sets no `shell:`, so Windows runs PowerShell, where a
        # `\` continuation is not one — it reached cargo as an argument in v0.4.1.
        run: >-
          cargo build --release --locked --target ${{ matrix.target }}
          -p ${{ env.BINARY_NAME }} -p ${{ env.PLUGIN_NAME }} -p ${{ env.RECON_NAME }}

      # ── Package ───────────────────────────────────────────────────────────

      # `TAG` through the environment, never interpolated into the script.
      # Actions substitutes an expression into the *text* of `run:` before any
      # shell sees it, and a git ref name may contain a backtick, `$`, `(` or
      # `|`. A tag is pushable by anyone with write access, so a tag named to
      # close the quoting would run its own commands on four runners holding a
      # `contents: write` token.
      - name: Package (Unix)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          package() {
            local name="$1"
            local bin="target/${{ matrix.target }}/release/$name"
            test -x "$bin" || { echo "::error::$bin was not built"; exit 1; }
            local archive="$name-$TAG-${{ matrix.target }}.tar.gz"
            tar -czf "$archive" -C "$(dirname "$bin")" "$(basename "$bin")"
            sha256sum "$archive" > "$archive.sha256"
          }
          package "${{ env.BINARY_NAME }}"
          package "${{ env.PLUGIN_NAME }}"
          package "${{ env.RECON_NAME }}"

      - name: Package (Windows)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          function Package($name) {
            $bin = "target\${{ matrix.target }}\release\$name.exe"
            if (-not (Test-Path $bin)) { throw "$bin was not built" }
            $archive = "$name-$env:TAG-${{ matrix.target }}.zip"
            Compress-Archive -Path $bin -DestinationPath $archive
            $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
            "$hash  $archive" | Out-File -FilePath "$archive.sha256" -Encoding ASCII
          }
          Package "${{ env.BINARY_NAME }}"
          Package "${{ env.PLUGIN_NAME }}"
          Package "${{ env.RECON_NAME }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.target }}
          path: ${{ env.BINARY_NAME }}-*-${{ matrix.target }}.*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Only the packaged archives, never `web-dist`. The console bundle is an
      # input to the *build* jobs, which embed it in the binary; this job has no
      # use for it, and downloading everything meant `files:` swept it onto the
      # release. v0.3.1 shipped 18 loose JS/CSS/font files next to the archives
      # that way — harmless (the binary already carries its own copy) and wrong.
      - name: Download the target artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: ${{ env.BINARY_NAME }}-*
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      # Fail loudly rather than publishing a short set: four targets, each with
      # two archives and their checksums. A build job that silently stopped
      # uploading would otherwise produce a release missing a platform, which
      # nobody notices until someone's install breaks.
      - name: Every expected asset is present, and nothing else
        run: |
          # Four targets x three binaries (`h5i` and the two plugins) x
          # (archive + checksum).
          expected=24
          found=$(find artifacts -maxdepth 1 -type f \
            \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' \) | wc -l)
          extra=$(find artifacts -mindepth 1 -maxdepth 1 \
            ! \( -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' \) \) )
          if [ "$found" -ne "$expected" ]; then
            echo "::error::expected $expected release assets, found $found"
            exit 1
          fi
          if [ -n "$extra" ]; then
            echo "::error::unexpected entries in artifacts/:"
            echo "$extra"
            exit 1
          fi
          echo "ok: $found assets, nothing extra"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: "h5i ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          # Flat, and only the archives: `artifacts/**` would pick up any
          # directory a future artifact adds. The guard above already refuses
          # that case; this keeps the upload correct even if the guard changes.
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.sha256
          body: |
            ## Install

            One binary. `h5i` is the confined development environment, and it
            carries its own browser engine.

            **Linux / macOS:**
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/h5i-${{ github.ref_name }}-<TARGET>.tar.gz | tar -xz
            sudo mv h5i /usr/local/bin/
            ```

            **Windows:** download the `.zip`, extract `h5i.exe`, and add it to your `PATH`.

            ### The browser

            ```bash
            h5i browser open https://example.com
            h5i browser snapshot
            h5i browser requests     # what it asked for, and what was refused
            h5i browser audit        # the whole session, afterwards
            ```

            The rendering engine is part of this binary. It used to ship as a
            second archive (`h5i-browser-light`); `h5i browser` execs itself to
            become it now, and `h5i __engine` reaches its own CLI for the cases
            that want it directly.

            ### The websec workbench

            `h5i-websec` is a separate archive, and installing it is a
            deliberate act:

            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/h5i-websec-${{ github.ref_name }}-<TARGET>.tar.gz | tar -xz
            h5i plugin install websec --from ./h5i-websec
            ```

            It holds no privilege of its own: every verb runs the `h5i browser`
            verbs a person would type, through the same policy, budget and
            receipts.

            ### The recon ledger

            `h5i-recon` is the other plugin, and it arrives the same way:

            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/h5i-recon-${{ github.ref_name }}-<TARGET>.tar.gz | tar -xz
            h5i plugin install recon --from ./h5i-recon
            ```

            It records what a target exposes, where each candidate came from,
            and which stored message confirmed it. Discovery only: a URL read
            out of a bundle stays a candidate until a request answers for it,
            and nothing here is called a vulnerability.

            Every request it makes is checked against an allowlist — every
            request and every redirect hop — and written to the log before any
            bytes move. A request that is not in `h5i browser requests` did not
            happen. What a box adds, with `--in`, is that the record gains a
            witness outside the browser; on a bare host that part is not
            claimed.

            ### Available targets

            | Target | Platform |
            |--------|---------|
            | `x86_64-unknown-linux-musl` | Linux x86_64 (static, glibc-free) |
            | `aarch64-unknown-linux-musl` | Linux arm64 (static, glibc-free) |
            | `aarch64-apple-darwin` | macOS Apple Silicon (arm64) |
            | `x86_64-pc-windows-msvc` | Windows x86_64 |

            Intel Macs have no published build: Rosetta 2 translates x86_64 to
            arm64, not the reverse, so the `aarch64-apple-darwin` archive will
            not run there. Build from source instead:
            `cargo install --git https://github.com/${{ github.repository }}`

            Each archive is accompanied by a `.sha256` checksum file.

  # The `h5i-agent` Python wheel: the WebAssembly harness as an installable CLI
  # (`pip install <the wheel>` then `h5i-agent web` / `h5i-agent wasmtime`). It
  # bundles the wasm module and the browser page, so it is platform-independent
  # (one py3-none-any wheel, not a per-target build) and is attached out of band
  # rather than threaded through the target matrix and its strict asset guard.
  wheel:
    name: Build and attach the h5i-agent wheel
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (wasm target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the wheel
        working-directory: crates/h5i-wasm-harness
        run: |
          python -m pip install --upgrade build
          ./scripts/build-wheel.sh

      # Additive upload onto the release the previous job created, so the strict
      # 16-asset guard never has to account for these files. --clobber keeps a
      # re-run idempotent.
      - name: Attach to the release
        working-directory: crates/h5i-wasm-harness/dist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          for f in h5i_agent-*.whl; do sha256sum "$f" > "$f.sha256"; done
          gh release upload "$TAG" \
            h5i_agent-*.whl h5i_agent-*.whl.sha256 \
            --repo "${{ github.repository }}" --clobber
